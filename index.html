<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Vorton — an inference-first native language under active development.">
    <meta name="theme-color" content="#f2f1ec" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0d1211" media="(prefers-color-scheme: dark)">
    <title>Vorton</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>

    <div class="page">
      <header class="site-header">
        <a class="wordmark" href="/" aria-label="Vorton home">
          <span class="wordmark-sign" aria-hidden="true">V/</span>
          <span>Vorton</span>
        </a>
        <a class="github-link" href="https://github.com/vorton-lang">
          GitHub <span aria-hidden="true">↗</span>
        </a>
      </header>

      <main id="content">
        <section class="hero" aria-labelledby="hero-title">
          <div class="hero-copy">
            <p class="status"><span aria-hidden="true"></span>Under active development.</p>
            <h1 id="hero-title">Vorton</h1>
            <p class="tagline">An inference-first native language.</p>
          </div>

          <div class="orbital" aria-hidden="true">
            <span>V</span>
          </div>
        </section>

        <section class="focus" aria-labelledby="focus-title">
          <h2 id="focus-title" class="visually-hidden">Design focus</h2>
          <ol>
            <li><span class="index">01</span><span>explicit effects</span></li>
            <li><span class="index">02</span><span>deterministic resources</span></li>
            <li><span class="index">03</span><span>C11 native output</span></li>
          </ol>
        </section>
      </main>

      <footer>
        <span>Vorton</span>
        <span>vortonlang.org</span>
      </footer>
    </div>
  </body>
</html>
